services:
  app:
    image: ghcr.io/starfie1d1272/send-to-myself:1.0.2
    restart: unless-stopped
    environment:
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      SECURE_COOKIE: "false"
      MAX_UPLOAD_BYTES: "52428800"
      TRASH_RETENTION_DAYS: "30"
    ports:
      - "18787:8787"
    volumes:
      - type: bind
        source: ${STM_DATA_DIR}
        target: /data
        bind:
          create_host_path: false
