# NAS 基础模板：先创建专用 data 目录，再填写口令和真实绝对路径。
# 只需修改 AUTH_PASSWORD 和 source；端口冲突时只改左侧宿主端口。
# Compose 中口令的 $ 须写成 $$：例如 pa$$word 表示实际口令 pa$word。
# 局域网 HTTP 使用 false；启用 HTTPS 后在同一项目改为 true。
# 备份前停止 app，复制完整 data 目录；维护步骤见 docs/DEPLOY.md 的“备份与恢复”。
services:
  app:
    image: ghcr.io/starfie1d1272/send-to-myself:1.0.2
    restart: unless-stopped
    environment:
      AUTH_PASSWORD: "必须替换为自己的强口令"
      SECURE_COOKIE: "false"
      MAX_UPLOAD_BYTES: "52428800" # 单文件 50 MiB
    ports:
      - "8787:8787" # 只在冲突时修改左侧；右侧保持 8787
    volumes:
      - type: bind
        source: /必须替换为NAS上已存在的data绝对路径
        target: /data
        bind:
          create_host_path: false
