# HTTPS 叠加文件，不能单独运行；必须与原项目的基础 Compose 一起使用。
# Caddyfile、caddy-data、caddy-config 相对于基础文件所在项目目录。
# 域名须解析到此主机且 80/443 可达；证书服务不提供内网穿透。
# 具体步骤见 docs/DEPLOY.md。
services:
  app:
    environment:
      SECURE_COOKIE: "true"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
