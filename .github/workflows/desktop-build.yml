name: Desktop Build

# 打包桌面壳（apps/desktop）：
# - 手动触发（workflow_dispatch）：产出可下载的安装包构件，用来自测（含 Windows）。
# - 推送 desktop-v* tag：额外创建一个 GitHub Release 并附上安装包，Release 说明自动从 CHANGELOG 提取。
#   （壳与核心版本独立，见 docs/VERSIONING.md；打核心 v* 不会触发本工作流）
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install deps
        run: |
          npm install -g node-gyp
          pnpm install --frozen-lockfile
        env:
          npm_config_build_from_source: true
          # Windows + Node 24 下 node-gyp 并行 rebuild 会触发竞态
          # "Completion callback never invoked!" → 强制单线程规避
          npm_config_jobs: 1

      - name: Build app
        working-directory: apps/desktop
        run: pnpm tauri build

      # 自测用：无论触发方式都上传构件
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sendtomyself-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # 从 CHANGELOG 提取当前版本说明，供 Release body 用
      - name: Extract changelog
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # desktop-v1.0.0 → 1.0.0
          VER="${TAG#desktop-v}"
          # 提取 CHANGELOG 中对应版本的整段
          BODY=$(awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          # 多行输出到 GITHUB_OUTPUT
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/*.dmg
            dist/*.msi
            dist/*.exe
