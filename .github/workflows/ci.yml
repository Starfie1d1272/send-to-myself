name: CI

# 普通 push / PR 的非发布验证门。
# 真正的平台打包与镜像发布分别由 desktop-build.yml / docker-image.yml 负责。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm quality:install

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm audit --audit-level high

      - run: pnpm quality:audit

      - run: pnpm --filter @sendtomyself/web build

      - run: pnpm --filter desktop build

      - run: pnpm --filter send-to-myself-raycast build

      - name: Package locally installable Raycast extension
        working-directory: apps/raycast
        run: zip -r ../../sendtomyself-raycast.zip src assets package.json tsconfig.json README.md LICENSE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sendtomyself-raycast
          path: sendtomyself-raycast.zip

      - run: docker build -t send-to-myself:ci .

      - name: Docker backup and restore rehearsal
        run: pnpm test:recovery
        env:
          RECOVERY_IMAGE: send-to-myself:ci

  native-style:
    name: Rust and shell style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
          components: rustfmt

      - name: Check Rust formatting without building Tauri
        run: cargo +1.99.1 fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install pinned shell tooling
        run: python -m pip install shellcheck-py==0.11.0.1 shfmt-py==3.12.0.2

      - name: Check shell formatting and lint
        run: |
          git ls-files -z -- '*.sh' | xargs -0 shfmt -d -i 2 -ci
          git ls-files -z -- '*.sh' | xargs -0 shellcheck
