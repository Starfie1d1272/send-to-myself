name: CI

# 普通 push / PR 的非发布验证门。
# 真正的平台打包与镜像发布分别由 desktop-build.yml / docker-image.yml 负责。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm audit --audit-level high

      - run: pnpm --filter @sendtomyself/web build

      - run: pnpm --filter desktop build

      - run: pnpm --filter send-to-myself-raycast build

      - name: Package locally installable Raycast extension
        working-directory: apps/raycast
        run: zip -r ../../sendtomyself-raycast.zip src assets package.json tsconfig.json README.md LICENSE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sendtomyself-raycast
          path: sendtomyself-raycast.zip

      - run: docker build -t send-to-myself:ci .

      - name: Docker backup and restore rehearsal
        run: pnpm test:recovery
        env:
          RECOVERY_IMAGE: send-to-myself:ci
